<!DOCTYPE html>
<html lang = "eng">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
        <title>Course Signup</title>
        <link rel = "stylesheet" href = "styles.css">
    </head>
    <body>
        <header id = "main-header">
            <h1>Web Development</h1>
            <p>Learn HTML & CSS from scratch.</p>
        </header>

        <main class = "container">
            <section class = "info-box">
                <h2>Course Topics</h2>
                <ul>
                    <li>HTML Structure and DOM</li>
                    <li>CSS Styling</li>
                    <li>Forms and Inputs</li>
                    <li>Tables</li>
                </ul>
            </section>


            <form class="signup-form" onsubmit="event.preventDefault(); alert('Form Submitted Successfully!');">
                <h2>Sign Up</h2>
                <div class = "form-group">
                    <label for = "fullname">Full Name: </label>
                    <input type = "text" id = "fullname" name = "full-name" required>
                </div>
                <div class = "form-group">
                    <label for = "email">Email Address: </label>
                    <input type = "email" id="email" name="user_email" required>
                </div>
                <button type="submit" class="btn">Submit</button>
            </form>
        </main>
    </body>
</html>
