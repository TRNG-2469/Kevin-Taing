<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working with Attributes</title>
</head>
<body>
    <img id = "photo" src = "old.jpg"/>
    Display the value for src attribute using console.log
    Change the value for src attribute
    Display the value for src attribute using console.log
    <script>
        const imgElement = document.getElementById("photo");
        console.log(imgElement.getAttribute("src"));
        imgElement.setAttribute("src", "new.jpg");
        console.log(imgElement.getAttribute("src"));
    </script>
</body>
</html>
